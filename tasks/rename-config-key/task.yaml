prompt: |
  We renamed the config key `timeout` to `timeout_s` in the defaults, and now
  creating a Client crashes with a KeyError. Make all code use `timeout_s`. Old
  user config files still say `timeout`, so `load_config` must keep accepting it
  as a fallback (mapped to `timeout_s`) when `timeout_s` is not given. Run the
  tests before you finish.
max_steps: 20
timeout_s: 300
tags: [multi-file, refactor, needs-search]
