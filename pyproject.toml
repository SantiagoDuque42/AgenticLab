[project]
name = "miniagent"
version = "0.1.0"
description = "A from-scratch coding agent with its own eval harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
miniagent = "miniagent.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
